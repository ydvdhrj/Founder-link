spring:
  datasource:
    url: jdbc:h2:mem:teams;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

eureka:
  client:
    enabled: false

jwt:
  secret: FounderLinkDevSecretKeyMustBeAtLeast32BytesLong!!
