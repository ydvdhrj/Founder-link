<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="logo">◆</span>
      <span>FounderLink</span>
    </div>

    <h1 class="title">Welcome back</h1>
    <p class="subtitle">Sign in to continue to your dashboard</p>

    @if (expired) {
      <div class="alert">Your session expired. Please sign in again.</div>
    }
    @if (error()) {
      <div class="alert error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Email</label>
        <input type="email" class="input" formControlName="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password" class="input" formControlName="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn primary" type="submit" style="width: 100%;" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Signing in…' : 'Sign In' }}
      </button>
    </form>

    <div class="footer-link">
      Don't have an account? <a routerLink="/signup">Create one</a>
    </div>
  </div>
</div>
