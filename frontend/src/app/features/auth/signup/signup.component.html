<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <span class="logo">◆</span>
      <span>FounderLink</span>
    </div>

    <h1 class="title">Create your account</h1>
    <p class="subtitle">Join the network of founders & investors</p>

    @if (error()) {
      <div class="alert error">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Full Name</label>
        <input class="input" type="text" formControlName="name" placeholder="Jane Doe" autocomplete="name" />
      </div>

      <div class="field">
        <label>Email</label>
        <input class="input" type="email" formControlName="email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="field">
        <label>Password</label>
        <input class="input" type="password" formControlName="password" placeholder="At least 8 characters" autocomplete="new-password" />
      </div>

      <div class="field">
        <label>I am a…</label>
        <div class="role-picker">
          @for (opt of roleOptions; track opt.value) {
            <div
              class="role-option"
              [class.selected]="form.value.role === opt.value"
              (click)="selectRole(opt.value)"
            >
              <div>{{ opt.label }}</div>
              <div style="font-size: .72rem; opacity: .7; margin-top: 2px;">{{ opt.hint }}</div>
            </div>
          }
        </div>
      </div>

      <button class="btn primary" type="submit" style="width: 100%;" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Creating account…' : 'Create Account' }}
      </button>
    </form>

    <div class="footer-link">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </div>
</div>
