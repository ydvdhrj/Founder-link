<div class="page-head">
  <div>
    <h1>{{ mode() === 'edit' ? 'Edit Profile' : 'Create Your Profile' }}</h1>
    <p>Tell the community about your skills, experience and portfolio.</p>
  </div>
  <a class="btn ghost" routerLink="/profile">Cancel</a>
</div>

<div class="card" style="max-width: 820px;">
  @if (error()) { <div class="alert error">{{ error() }}</div> }
  @if (success()) { <div class="alert success">{{ success() }}</div> }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-2">
      <div class="field">
        <label>Full Name</label>
        <input class="input" formControlName="name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input class="input" type="email" formControlName="email" />
      </div>
    </div>

    <div class="field">
      <label>Skills</label>
      <input class="input" formControlName="skills" placeholder="Angular, Spring Boot, Product Strategy…" />
    </div>

    <div class="field">
      <label>Experience</label>
      <textarea class="input" formControlName="experience" placeholder="Your background…"></textarea>
    </div>

    <div class="field">
      <label>Bio</label>
      <textarea class="input" formControlName="bio" placeholder="A short intro about yourself"></textarea>
    </div>

    <div class="field">
      <label>Portfolio Links</label>
      <div formArrayName="portfolioLinks" style="display: flex; flex-direction: column; gap: .5rem;">
        @for (ctrl of linksArr.controls; track $index) {
          <div style="display: flex; gap: .5rem;">
            <input class="input" [formControlName]="$index" placeholder="https://…" />
            <button type="button" class="btn ghost sm" (click)="removeLink($index)">Remove</button>
          </div>
        }
      </div>
      <button type="button" class="btn ghost sm" style="margin-top: .5rem;" (click)="addLink()">+ Add link</button>
    </div>

    <div style="display: flex; gap: .75rem;">
      <button class="btn primary" type="submit" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Saving…' : (mode() === 'edit' ? 'Save Changes' : 'Create Profile') }}
      </button>
      <a class="btn ghost" routerLink="/profile">Cancel</a>
    </div>
  </form>
</div>
