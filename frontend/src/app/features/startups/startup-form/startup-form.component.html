<div class="page-head">
  <div>
    <h1>Create Startup</h1>
    <p>Share your venture with founders and investors.</p>
  </div>
  <a class="btn ghost" routerLink="/startups">Cancel</a>
</div>

<div class="card" style="max-width: 820px;">
  @if (error()) { <div class="alert error">{{ error() }}</div> }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label>Startup Name</label>
      <input class="input" formControlName="name" placeholder="Nimbus AI" />
    </div>
    <div class="field">
      <label>Industry</label>
      <input class="input" formControlName="industry" placeholder="FinTech, HealthTech, AI…" />
    </div>
    <div class="grid grid-2">
      <div class="field">
        <label>Stage</label>
        <select class="input" formControlName="stage">
          @for (s of stages; track s.value) { <option [value]="s.value">{{ s.label }}</option> }
        </select>
      </div>
      <div class="field">
        <label>Funding Goal (USD)</label>
        <input class="input" type="number" formControlName="fundingGoal" min="0" placeholder="250000" />
      </div>
    </div>
    <div class="field">
      <label>Description</label>
      <textarea class="input" formControlName="description" placeholder="What does your startup do?"></textarea>
    </div>

    <div style="display: flex; gap: .75rem;">
      <button class="btn primary" [disabled]="loading() || form.invalid">
        {{ loading() ? 'Creating…' : 'Create Startup' }}
      </button>
      <a class="btn ghost" routerLink="/startups">Cancel</a>
    </div>
  </form>
</div>
