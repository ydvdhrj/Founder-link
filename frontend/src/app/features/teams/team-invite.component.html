<div class="page-head">
  <div>
    <h1>Invite a Co-founder</h1>
    <p>Send invitations to join your startup team.</p>
  </div>
  <a class="btn ghost" routerLink="/dashboard">Back</a>
</div>

<div class="card" style="max-width: 720px;">
  @if (error()) { <div class="alert error">{{ error() }}</div> }
  @if (success()) { <div class="alert success">{{ success() }}</div> }

  @if (myStartups().length === 0) {
    <div class="alert">You need to create a startup first before inviting team members. <a routerLink="/startups/new">Create one →</a></div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="field">
      <label>Startup</label>
      <select class="input" formControlName="startupId">
        <option value="" disabled>Select one of your startups…</option>
        @for (s of myStartups(); track s.id) {
          <option [value]="s.id">{{ s.name }}</option>
        }
      </select>
    </div>

    <div class="field">
      <label>Invitee Email</label>
      <input class="input" type="email" formControlName="inviteeEmail" placeholder="cofounder@example.com" />
      <small style="color: var(--text-dim); font-size: .78rem;">We'll look them up in the user directory.</small>
    </div>

    <div class="field">
      <label>Role</label>
      <select class="input" formControlName="role">
        @for (r of roles; track r.value) { <option [value]="r.value">{{ r.label }}</option> }
      </select>
    </div>

    <button class="btn primary" [disabled]="loading() || form.invalid || myStartups().length === 0">
      {{ loading() ? 'Sending…' : 'Send Invitation' }}
    </button>
  </form>
</div>
